    <style>
        :root {
            --primary-red: #E53935;
            --bg-light: #F8FAFC;
            --text-dark: #1E293B;
            --white: #fff;
        }

        /* RESET */
        body {
            margin: 0;
            font-family: Roboto;
            background: #fff;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 0 20px;
        }

        /* --- Navbar (Preserved) --- */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .nav-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .logo {
            font-family: 'Bebas Neue', cursive;
            font-size: 2.2rem;
            letter-spacing: 1px;
            color: var(--text-dark);
            text-decoration: none;
        }

        .logo span {
            color: var(--primary-red);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .nav-menu a:hover {
            color: var(--primary-red);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 1100;
        }

        .hamburger div {
            width: 25px;
            height: 3px;
            background-color: var(--text-dark);
            margin: 5px;
            transition: var(--transition-speed);
        }

        .btn-quote {
            background: var(--primary-red);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: 700;
            border-radius: 2px;
        }

        @media (max-width: 992px) {

            .hamburger {
                display: block;
            }

            .nav-menu {
                position: fixed;
                right: -100%;
                top: 0;
                height: 100vh;
                width: 280px;
                background: #fff;
                flex-direction: column;
                align-items: flex-start;
                padding: 100px 20px;
                gap: 20px;
                box-shadow: -10px 0 30px rgba(0, 0, 0, 0.15);
                transition: 0.4s ease;
            }

            .nav-menu.active {
                right: 0;
            }

            .nav-menu li {
                width: 100%;
            }

            .nav-menu a {
                display: block;
                width: 100%;
                padding: 12px 0;
                font-size: 1rem;
            }

            .btn-quote {
                display: none;
            }
        }

        /* HERO */
        .page-hero {
            margin-top: 60px;
            height: 120px;
            background: #111;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Bebas Neue;
            font-size: 2rem;
        }

        /* SEARCH */
        .search-section {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .search-container {
            display: flex;
            max-width: 800px;
            margin: auto;
        }

        .search-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
        }

        .search-btn {
            background: var(--primary-red);
            color: #fff;
            border: none;
            padding: 12px;
        }

        /* LAYOUT */
        .catalog-flex {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: var(--bg-light);
        }

        /* SIDEBAR */
        .sidebar {
            width: 300px;
            background: #fff;
            border: 1px solid #ddd;
        }

        .sidebar-header {
            background: #111;
            color: #fff;
            padding: 15px;
            font-family: Bebas Neue;
        }

        .main-cat {
            width: 100%;
            padding: 12px;
            border: none;
            background: #fff;
            text-align: left;
            font-weight: bold;
            cursor: pointer;
        }

        .sub-menu {
            display: none;
        }

        .sub-menu a {
            display: block;
            padding: 10px 20px;
            font-size: 13px;
            cursor: pointer;
        }

        .main-cat.active+.sub-menu {
            display: block;
        }

        /* GRID */
        .product-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #fff;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        .product-img {
            height: 180px;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            text-align: center;
            padding: 10px;
            font-family: Bebas Neue;
        }

        /* PANEL */
        .detail-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: none;
            z-index: 1000;
        }

        .detail-panel {
            position: fixed;
            right: -550px;
            top: 0;
            width: 350px;
            height: 100%;
            background: #fff;
            padding: 25px;
            transition: .3s;
            z-index: 1100;
            overflow-y: auto;
        }

        .detail-panel {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }


        .detail-panel.active {
            right: 0;
        }

        .slider {
            position: relative;
            height: 220px;
            /* reduce from 250px */
            max-height: 40vh;
            /* responsive limit */
            overflow: hidden;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* IMPORTANT: prevents cutting + overflow */
            background: #f5f5f5;
        }

        #title {
            margin-top: 15px;
            font-size: 1.5rem;
        }

        #desc {
            margin-top: 10px;
            line-height: 1.5;
            white-space: pre-line;
            /* keeps your line breaks */
        }

        .slide.active {
            display: block;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: #000;
            color: #fff;
            padding: 10px;
            cursor: pointer;
        }

        .prev {
            left: 0;
        }

        .next {
            right: 0;
        }

        .panel-whatsapp {
            display: block;
            background: #25D366;
            color: #fff;
            text-align: center;
            padding: 15px;
            margin-top: 150px;
            text-decoration: none;
        }

        /* CLOSE BUTTON */
        .close-btn {
            position: absolute;
            top: 2px;
            right: 15px;
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .detail-panel {
                width: 100%;
                right: -100%;
                padding: 20px 15px;
                border-top-left-radius: 15px;
                border-top-right-radius: 15px;
            }

            .detail-panel.active {
                right: 0;
            }

            .slider {
                height: 200px;
                margin-top: 10px;
            }

                font-size: 1.4rem;
                margin-top: 10px;
            }

                line-height: 1.4;
            }

                font-size: 1rem;
                padding: 14px;
                border-radius: 6px;
            }
        }
    </style>
</head>

        let products = [];

        Object.keys(catalog).forEach(cat => {
            Object.keys(catalog[cat]).forEach(sub => {
                catalog[cat][sub].forEach(p => {
                    products.push({ ...p, cat, sub });
                });
            });
        });

        /* =======================
           SIDEBAR MENU
        ======================= */
        const menu = document.getElementById("menu");

        Object.keys(catalog).forEach(cat => {
            let btn = document.createElement("button");
            btn.className = "main-cat";
            btn.innerText = cat;

            let subMenu = document.createElement("div");
            subMenu.className = "sub-menu";

            Object.keys(catalog[cat]).forEach(sub => {
                let subBtn = document.createElement("a");
                subBtn.innerText = sub;

                subBtn.onclick = () => {
                    let list = [];
                    catalog[cat][sub].forEach(p => list.push(p));
                    render(list);
                };

                subMenu.appendChild(subBtn);
            });

            btn.onclick = () => btn.classList.toggle("active");

            menu.appendChild(btn);
            menu.appendChild(subMenu);
        });

        function render(list) {
            grid.innerHTML = "";

            list.forEach(p => {
                grid.innerHTML += `
<div class="product-card" onclick='openPanel(${JSON.stringify(p)})'>
    <div class="product-img">
        <img src="${p.images?.[0] || "https://source.unsplash.com/400x300/?engine"}">
    </div>
    <div class="product-info">
        <h3>${p.code}</h3>
        <p>${p.name}</p>
    </div>
</div>`;
            });
        }

        /* =======================
           PRODUCT GRID
        ======================= */
        const grid = document.getElementById("grid");

        function render(list) {
            grid.innerHTML = "";

            list.forEach(p => {
                grid.innerHTML += `
<div class="product-card" onclick='openPanel(${JSON.stringify(p)})'>
    <div class="product-img">
        <img src="${p.images ? p.images[0] : "https://source.unsplash.com/400x300/?engine"}">
    </div>
    <div class="product-info">
        <h3>${p.code}</h3>
        <p>${p.name}</p>
    </div>
</div>`;
            });
        }
        render(products);


        /* =======================
           SEARCH
        ======================= */
        document.getElementById("search").onkeyup = e => {
            let v = e.target.value.toLowerCase();
            render(products.filter(p =>
                p.name.toLowerCase().includes(v) ||
                p.code.includes(v)
            ));
        };


        /* =======================
           PANEL SYSTEM
        ======================= */
        let slideIndex = 0;
        let currentProduct = null;

        function openPanel(product) {
            currentProduct = product;

            overlay.style.display = "block";
            panel.classList.add("active");

            title.innerText = product.name;

            desc.innerText = `
Code: ${product.code}
\n${product.details}
`;

            wa.href = `https://wa.me/94714421360?text=Inquiry about ${product.name} (${product.code})`;

            // LOAD IMAGES
            slides.innerHTML = product.images.map((img, i) =>
                `<img class="slide ${i === 0 ? "active" : ""}" src="${img}">`
            ).join("");

            slideIndex = 0;
        }


        /* =======================
           SLIDER
        ======================= */
        function changeSlide(n) {
            let s = document.querySelectorAll(".slide");
            if (!s.length) return;

            s[slideIndex].classList.remove("active");
            slideIndex = (slideIndex + n + s.length) % s.length;
            s[slideIndex].classList.add("active");
        }


        /* =======================
           CLOSE PANEL
        ======================= */
        overlay.onclick = () => {
            overlay.style.display = "none";
            panel.classList.remove("active");
        };

        const closeBtn = document.getElementById("closePanel");

        closeBtn.onclick = () => {
            overlay.style.display = "none";
            panel.classList.remove("active");
        };

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                overlay.style.display = "none";
                panel.classList.remove("active");
            }
        });

    </script>
